<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu apoio | Elas por Elas</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Poppins:wght@400;600;700&family=Quicksand:wght@400;500;600;700&family=Ubuntu:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

  <button class="quick-exit js-quick-exit" type="button" aria-label="Saída rápida: sair desta página agora">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
    Saída rápida
  </button>

  <header class="header">
    <div class="container header__inner">
      <a href="index.html" class="logo" aria-label="Elas por Elas, página inicial">Elas por Elas</a>

      <button class="menu-toggle" aria-expanded="false" aria-controls="menu" aria-label="Abrir menu">
        <span></span><span></span><span></span>
      </button>

      <nav id="menu" class="nav" aria-label="Menu principal">
        <a href="quem-somos.html" class="nav__link">Quem Somos</a>
        <a href="meu-apoio.html" class="nav__link" aria-current="page">Meu apoio</a>
        <a href="index.html" class="btn btn--outline nav__cta js-logout">Sair</a>
      </nav>
    </div>
  </header>

  <main id="conteudo" class="vol-page">

    <section class="vol-hero">
      <div class="container">
        <div class="vol-hero__box">
          <div class="vol-hero__text">
            <a href="inicio.html" class="back-link"><span aria-hidden="true">←</span> Voltar</a>
            <h1 class="vol-hero__title">
              Meu <span class="fs-underline">apoio</span>
            </h1>
            <p class="vol-hero__lead">
              Olá, <strong class="js-nome"></strong>! Aqui ficam os serviços e as voluntárias
              que você salvou, para encontrar quando precisar.
            </p>
          </div>
          <img class="vol-hero__image" src="../assets/img/icone-voluntaria.png" alt="" aria-hidden="true">
        </div>
      </div>
    </section>

    <section class="vol-list-wrap" aria-labelledby="apoio-titulo">
      <div class="container">
        <div class="vol-list__head">
          <h2 id="apoio-titulo" class="map-panel__title">Minha rede de apoio</h2>
          <span class="map-panel__count js-count" aria-live="polite"></span>
        </div>
        <div class="results__list js-lista" aria-busy="true">
          <p class="results__empty">Carregando…</p>
        </div>
      </div>
    </section>

  </main>

  <script src="../js/config.js"></script>
  <script src="../js/animacoes.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/dados-exemplo.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/meu-apoio.js"></script>
</body>
</html>
